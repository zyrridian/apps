name: Release app and update registry

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  # Keep your existing build and release jobs before this job.
  update-registry:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      STORE_PAT: ${{ secrets.STORE_PAT }}
      APP_ID: example-app
      APP_VERSION: 1.0.0
      RELEASE_URL: https://github.com/${{ github.repository }}/releases/tag/v1.0.0
    steps:
      - uses: actions/checkout@v4

      - name: Check out app registry
        uses: actions/checkout@v4
        with:
          repository: zyrridian/apps
          token: ${{ secrets.STORE_PAT }}
          path: storefront-repo

      - name: Copy release files and metadata
        run: |
          mkdir -p "storefront-repo/apps/$APP_ID/screenshots"
          cp app-release.apk "storefront-repo/apps/$APP_ID/app-release.apk"
          cp store/icon.png "storefront-repo/apps/$APP_ID/icon.png"
          cp store/screenshots/* "storefront-repo/apps/$APP_ID/screenshots/"
          cat > "storefront-repo/apps/$APP_ID/manifest.json" <<EOF
          {
            "schema": "v1",
            "id": "$APP_ID",
            "name": "Example App",
            "version": "$APP_VERSION",
            "description": "Replace this description.",
            "category": "Utility",
            "repository": "https://github.com/${{ github.repository }}",
            "release": "$RELEASE_URL",
            "featured": false,
            "icon": "icon.png",
            "artifacts": [{ "platform": "android", "type": "apk", "filename": "app-release.apk" }],
            "screenshots": []
          }
          EOF

      - name: Generate normalized registry
        working-directory: storefront-repo
        run: |
          REGISTRY_GENERATED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            node scripts/generate-registry.mjs

      - name: Commit registry update
        working-directory: storefront-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/$APP_ID registry/apps.json
          git commit -m "Auto-release: $APP_ID v$APP_VERSION" || echo "No changes to commit"
          git push
